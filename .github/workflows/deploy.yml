name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deployment package
        run: |
          mkdir package
          pip install \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --only-binary=:all: \
            -t package/ \
            -r discord_handler/requirements.txt
          cp discord_handler/*.py package/
          cd package && zip -r ../deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://deployment.zip

      - name: Install sync dependencies
        run: pip install -r sync_application_commands/requirements.txt

      - name: Sync Discord application commands
        run: |
          python sync_application_commands/sync_application_commands.py \
            --application_id ${{ vars.DISCORD_APPLICATION_ID }} \
            --bot_token ${{ secrets.DISCORD_BOT_TOKEN }} \
            --commands sync_application_commands/commands.json
