name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12' # Same as used in AWS Lambda
        cache: 'pip'
        cache-dependency-path: |
          discord_handler/requirements.txt
          discord_handler/dev_requirements.txt
    - name: Install dependencies
      working-directory: ./discord_handler
      run: pip install -r requirements.txt -r dev_requirements.txt
    - name: Run tests
      working-directory: ./discord_handler
      run: |
        python -m unittest discover -v
