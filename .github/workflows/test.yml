name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12' # Same as used in AWS Lambda
        cache: 'pip'
        cache-dependency-path: |
          discord_handler/requirements.txt
          discord_handler/dev_requirements.txt
    - name: Install dependencies
      working-directory: ./discord_handler
      run: pip install -r requirements.txt -r dev_requirements.txt
    - name: Run tests
      working-directory: ./discord_handler
      run: |
        python -m unittest discover -v
